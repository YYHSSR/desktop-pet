name: Build Windows App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-windows:
    runs-on: windows-latest
    # 编码隔离（issue #26）：PYTHONIOENCODING 只解决控制台输出，
    # PYTHONUTF8=1 让 locale.getpreferredencoding() 恒为 utf-8，杜绝
    # PyInstaller/辅助脚本按 GBK/cp1252 二次解码中文源码或资源。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # choco 的 innosetup 包不带 ChineseSimplified.isl（官方安装包才附带），
      # 缺少该文件 .iss 编译会失败，从 issrc 仓库取回。
      - name: Fetch ChineseSimplified language file
        shell: pwsh
        run: |
          $langDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\Languages'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' -OutFile (Join-Path $langDir 'ChineseSimplified.isl')

      # 与 Linux/macOS 一致：构建前先跑测试套件，避免发布损坏产物。
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # 发布只构建标准 WebM 产物；旧变体名仍由本地脚本兼容。
      - name: Build onedir package
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\build_onedir.ps1" -Variant webm-chat
          if ($LASTEXITCODE -ne 0) { throw "webm-chat build failed" }

      # 参数用数组 splatting 传递：行首 /D... 会被 pwsh 当作除法运算符，
      # 含括号的显示名（如 "(WebM)"）会触发子表达式解析而报 ParserError。
      # 版本号从 pet/__init__.py 的 __version__ 单一来源读取，避免与
      # updater 更新检测基准漂移。
      - name: Compile installers (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path 'pet\__init__.py' -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          Write-Host "==> AppVersion from __version__: $version"
          & ISCC.exe packaging\dsh-pet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC webm-chat failed" }
          Get-ChildItem dist-onedir\*-setup.exe | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-standalone-windows-x86_64
          path: |
            dist-onedir/*-portable.zip
            dist-onedir/*-setup.exe
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-onedir/*-portable.zip
            dist-onedir/*-setup.exe
          generate_release_notes: true
